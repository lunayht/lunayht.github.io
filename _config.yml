layout: sidebar
style: light

plugins:
  - jekyll-octicons
  - jekyll-github-metadata
  - jemoji

permalink: /:year/:month/:day/:title/

defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
      type: "posts"
    values:
      layout: "post"

projects:
  sort_by: stars
  # sort_by options:
  #   - pushed
  #   - stars
  limit: 4
  exclude:
    archived: false
    forks: true
    projects:
    # - repo-name

social_media:
  # behance: your_username
  # dribbble: your_username
  # facebook: your_username
  hackerrank: lunayht
  # instagram: your_username
  # keybase: your_username
  linkedin: ying-hui-t
  # mastodon: your_username
  # medium: your_username
  # stackoverflow: your_user_id
  # telegram: your_username
  # twitter: your_username
  # unsplash: your_username
  # vk: your_username
  # website: http://your_website_url
  # youtube: your_username

topics:
  - name: Project Euler
    web_url: https://projecteuler.net/about
    image_url: https://projecteuler.net/favicons/apple-touch-icon.png

  - name: Gödel, Escher, Bach (GEB)
    web_url: https://en.wikipedia.org/wiki/Gödel,_Escher,_Bach
